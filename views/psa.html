<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PSA Tracking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="nav">
        <img class="logo-img" id="navbar-logo" src="images/logo.jpg">
        <span class="navbar-brand">AA Cards and Collectibles</span>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="/">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link " href="/calender">Calender</a>
            </li>
           
            <li class="nav-item">
              <a class="nav-link active" href="/psa">PSA Tracking</a>
            </li>
             <li class="nav-item">
              <a class="nav-link " href="/login">Login</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
      <div class="row">
        
        <div class="psa-table">
          <h2>Your Orders</h2>
        <table class="table table-striped">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Card Count</th>
                <th>Order Status</th>
                <th>Shipment Status</th>
                <th>Date Shipped</th>
              </tr>
            </thead>
            <tbody id="psaTableBody"></tbody>
          </table>
        </div>

        
      </div>
    </div>
   <footer>
      <div class="footer-logo">
        <img class="logo-img" id="navbar-logo" src="images/logo.jpg">
      </div>
      <div class="footer-name">
        <span class="footer">AA Cards and Collectibles</span>
      </div>
      <div class="social-links">
          <a href="https://www.facebook.com/share/1B6prTw5yZ/?mibextid=wwXIfr" target="_blank">
          <i class="fab fa-facebook"></i>
          </a>
          <a href="https://www.instagram.com/aacardssports?igsh=MWMxNmp5MTRrY2xzNw==" target="_blank">
          <i class="fab fa-instagram"></i>
          </a>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/nav.js"></script>


        <script>
      const params = new URLSearchParams(window.location.search);
      const customerIdFromUrl = params.get("customerId");
      let activeCustomerId = customerIdFromUrl || localStorage.getItem("activeCustomerId");

      if (customerIdFromUrl) {
        localStorage.setItem("activeCustomerId", customerIdFromUrl);
      }
      if (!activeCustomerId) {
        window.location.href = "/login";
      }

      fetch(`/customer-orders?customerId=${encodeURIComponent(activeCustomerId)}`)
        .then((response) => {
          if (!response.ok) {
            throw new Error("Failed to load order data");
          }
          return response.json();
        })
        .then((orders) => {
          const tableBody = document.getElementById("psaTableBody");

          if (orders.length === 0) {
            const row = document.createElement("tr");
            row.innerHTML = '<td colspan="5">No orders found for this account.</td>';
            tableBody.appendChild(row);
            return;
          }

          orders.forEach((order) => {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${order.OrderID}</td>
              <td>${order.cardCount || ""}</td>
              <td>${order.orderStatus || ""}</td>
              <td>${order.shipmentStatus || "Not Assigned"}</td>
              <td>${order.dateShipped ? new Date(order.dateShipped).toLocaleDateString() : ""}</td>
            `;
            tableBody.appendChild(row);
          });
        })
        .catch((error) => {
          console.error("Error loading JSON:", error);
          const tableBody = document.getElementById("psaTableBody");
          if (tableBody) {
            const row = document.createElement("tr");
            row.innerHTML = '<td colspan="3">Unable to load order data.</td>';
            tableBody.appendChild(row);
          }
        });
    </script>
  </body>
</html>
