<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Create PSA Order</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="nav">
        <span class="navbar-brand">AA Cards and Collectibles</span>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="/">Search</a>
            </li>

            <li class="nav-item">
              <a class="nav-link " href="/createorder">Create Order</a>
            </li>
           
            <li class="nav-item">
              <a class="nav-link active" href="/createshipment">Create Shipment</a>
            </li>
             <li class="nav-item">
              <a class="nav-link " href="/logout">Log Out</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
      <div class="row">
         
        <!-- Create Shipment Form -->
        <div class="shipment-form-section mb-5">
          <h2>Create Order</h2>
          <form id="shipmentForm" action="/createorder" method="POST">


            <div class="form-group mb-3">
              <label for="customerName">Customer Name:</label>
              <input type="text" id="customer" name="customer" placeholder="Customer Name" required>
            </div>

              <div class="form-group mb-3">
              <label for="cardCount">Card Count:</label>
              <input type="number" id="cardCount" name="cardCount" placeholder="Number of Cards" required>
            </div>

            <button type="submit" class="btn btn-primary">Create Order</button>
          </form>
        </div>

        </div>
    </div>
     <footer>
        <img class="logo-img" id="navbar-logo" src="images/logo.jpg">
        <span class="footer">AA Cards and Collectibles</span>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
