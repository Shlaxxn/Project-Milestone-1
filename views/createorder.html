<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Create PSA Order</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="nav">
        <span class="navbar-brand">AA Cards and Collectibles</span>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="/employeepsa">Search</a>
            </li>

            <li class="nav-item">
              <a class="nav-link " href="/createorder">Create Order</a>
            </li>
           
            <li class="nav-item">
              <a class="nav-link active" href="/createshipment">Create Shipment</a>
            </li>
             <li class="nav-item">
              <a class="nav-link " href="/logout">Log Out</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
      <div class="row">
         
        <!-- Create Shipment Form -->
        <div class="shipment-form-section mb-5">
          <h2>Create Order</h2>
          <form id="shipmentForm" action="/createorder" method="POST">
            <div class="form-group mb-3">
              <label for="customerName">Customer Name:</label>
              <input type="text" id="customer" name="customer" placeholder="Customer Name" required>
            </div>

            <div class="form-group mb-3">
              <label for="shipmentId">Assign Pending Shipment:</label>
              <select id="shipmentId" name="shipmentId" class="form-control">
                <option value="">-- Select a pending shipment (optional) --</option>
              </select>
              <small class="form-text text-muted">Choose a pending shipment to attach this order to the shipment.</small>
            </div>

            <div class="form-group mb-3">
              <label for="cardCount">Card Count:</label>
              <input type="number" id="cardCount" name="cardCount" placeholder="Number of Cards" required>
            </div>

            <button type="submit" class="btn btn-primary">Create Order</button>
          </form>
        </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/nav.js"></script>
    <script>
      async function loadPendingShipments() {
        const shipmentSelect = document.getElementById('shipmentId');

        try {
          const response = await fetch('/pending-shipments');
          if (!response.ok) {
            throw new Error('Failed to load pending shipments');
          }
          const shipments = await response.json();

          shipments.forEach((shipment) => {
            const option = document.createElement('option');
            option.value = shipment.ShipmentID;
            option.textContent = `Shipment ${shipment.ShipmentID}`;
            shipmentSelect.appendChild(option);
          });

          if (shipments.length === 0) {
            const option = document.createElement('option');
            option.value = '';
            option.textContent = 'No pending shipments available';
            shipmentSelect.appendChild(option);
            shipmentSelect.disabled = true;
          }
        } catch (err) {
          const option = document.createElement('option');
          option.value = '';
          option.textContent = 'Unable to load pending shipments';
          shipmentSelect.appendChild(option);
          shipmentSelect.disabled = true;
        }
      }

      loadPendingShipments();
    </script>
  </body>
</html>
